{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-5">
        <div class="card hover-lift">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>
                    Login to Workout Analyzer
                </h4>
            </div>
            <div class="card-body p-4">
                <!-- Alert for messages -->
                <div id="alert-container"></div>
                
                <form id="login-form">
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="fa-solid fa-user me-2"></i>Username or Email
                        </label>
                        <input type="text" class="form-control" id="username" 
                               placeholder="Enter your username or email" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fa-solid fa-lock me-2"></i>Password
                        </label>
                        <input type="password" class="form-control" id="password" 
                               placeholder="Enter your password" required>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me">
                        <label class="form-check-label" for="remember-me">
                            Remember me
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg" id="login-btn">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <small class="text-muted">
                        <a href="#" class="text-decoration-none">
                            <i class="fa-solid fa-key me-1"></i>Forgot Password?
                        </a>
                    </small>
                </div>
            </div>
            <div class="card-footer text-center">
                <p class="mb-2 text-muted">Don't have an account?</p>
                <a href="/auth/register" class="btn btn-outline-primary">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Account
                </a>
            </div>
        </div>
        
        <!-- Demo Credentials -->
        <div class="card mt-4 glass-effect border-0">
            <div class="card-body text-center">
                <h6 class="card-title">
                    <i class="fa-solid fa-circle-info text-info me-2"></i>
                    Demo Credentials
                </h6>
                <div class="d-flex justify-content-center gap-4 mt-3">
                    <div>
                        <small class="text-muted d-block">Username</small>
                        <strong>demo_user</strong>
                    </div>
                    <div>
                        <small class="text-muted d-block">Password</small>
                        <strong>demo123456</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>
// Initialize login form
document.addEventListener('DOMContentLoaded', function() {
    initializeLoginForm();
});
</script>
{% endblock %}
