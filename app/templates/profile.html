{% extends "base.html" %}

{% block content %}
<div class="row fade-in">
    <!-- Profile Info Sidebar -->
    <div class="col-md-4 mb-4">
        <div class="card hover-lift">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fa-solid fa-user me-2"></i>Profile Information
                </h5>
            </div>
            <div class="card-body">
                <div id="profile-info">
                    <div class="text-center py-4">
                        <div class="loading-spinner mx-auto mb-3"></div>
                        <p class="text-muted">Loading profile...</p>
                    </div>
                </div>
                
                <hr>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                        <i class="fa-solid fa-pen-to-square me-2"></i>Edit Profile
                    </button>
                    <button class="btn btn-outline-warning" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                        <i class="fa-solid fa-key me-2"></i>Change Password
                    </button>
                    <button class="btn btn-outline-danger logout-btn">
                        <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Statistics & Workouts -->
    <div class="col-md-8">
        <!-- Quick Stats -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-card-icon">
                        <i class="fa-solid fa-dumbbell"></i>
                    </div>
                    <div class="stat-card-value" id="stat-workouts">0</div>
                    <div class="stat-card-label">Total Workouts</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-card-icon" style="background: linear-gradient(135deg, #10b981 0%, #34d399 100%);">
                        <i class="fa-solid fa-repeat"></i>
                    </div>
                    <div class="stat-card-value" id="stat-reps">0</div>
                    <div class="stat-card-label">Total Reps</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-card-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <div class="stat-card-value" id="stat-calories">0</div>
                    <div class="stat-card-label">Calories Burned</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <div class="stat-card-icon" style="background: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 100%);">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <div class="stat-card-value" id="stat-accuracy">0%</div>
                    <div class="stat-card-label">Avg Accuracy</div>
                </div>
            </div>
        </div>
        
        <!-- Recent Workouts -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fa-solid fa-clock-rotate-left me-2"></i>Recent Workouts
                </h5>
            </div>
            <div class="card-body">
                <div id="recent-workouts">
                    <div class="text-center py-4">
                        <div class="loading-spinner mx-auto mb-3"></div>
                        <p class="text-muted">Loading workouts...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fa-solid fa-pen-to-square me-2"></i>Edit Profile
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="edit-alert-container"></div>
                
                <form id="edit-profile-form">
                    <div class="mb-3">
                        <label for="edit-full-name" class="form-label">
                            <i class="fa-solid fa-id-card me-2"></i>Full Name
                        </label>
                        <input type="text" class="form-control" id="edit-full-name">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="edit-age" class="form-label">
                                <i class="fa-solid fa-cake-candles me-2"></i>Age
                            </label>
                            <input type="number" class="form-control" id="edit-age" min="13" max="120">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit-height" class="form-label">
                                <i class="fa-solid fa-ruler-vertical me-2"></i>Height (cm)
                            </label>
                            <input type="number" class="form-control" id="edit-height" step="0.1">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="edit-weight" class="form-label">
                                <i class="fa-solid fa-weight-scale me-2"></i>Weight (kg)
                            </label>
                            <input type="number" class="form-control" id="edit-weight" step="0.1">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="edit-fitness-level" class="form-label">
                            <i class="fa-solid fa-dumbbell me-2"></i>Fitness Level
                        </label>
                        <select class="form-select" id="edit-fitness-level">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fa-solid fa-bullseye me-2"></i>Fitness Goals
                        </label>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="weight_loss" id="edit-goal-weight-loss">
                                    <label class="form-check-label" for="edit-goal-weight-loss">Weight Loss</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="muscle_gain" id="edit-goal-muscle-gain">
                                    <label class="form-check-label" for="edit-goal-muscle-gain">Muscle Gain</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="endurance" id="edit-goal-endurance">
                                    <label class="form-check-label" for="edit-goal-endurance">Endurance</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="strength" id="edit-goal-strength">
                                    <label class="form-check-label" for="edit-goal-strength">Strength</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="flexibility" id="edit-goal-flexibility">
                                    <label class="form-check-label" for="edit-goal-flexibility">Flexibility</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="general_fitness" id="edit-goal-general">
                                    <label class="form-check-label" for="edit-goal-general">General Fitness</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-profile-btn" onclick="saveProfile()">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fa-solid fa-key me-2"></i>Change Password
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="password-alert-container"></div>
                
                <form id="change-password-form">
                    <div class="mb-3">
                        <label for="current-password" class="form-label">
                            <i class="fa-solid fa-lock me-2"></i>Current Password
                        </label>
                        <input type="password" class="form-control" id="current-password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="new-password" class="form-label">
                            <i class="fa-solid fa-lock me-2"></i>New Password
                        </label>
                        <input type="password" class="form-control" id="new-password" required>
                        <div class="form-text">Minimum 8 characters</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm-new-password" class="form-label">
                            <i class="fa-solid fa-lock me-2"></i>Confirm New Password
                        </label>
                        <input type="password" class="form-control" id="confirm-new-password" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-warning" id="change-password-btn" onclick="changeUserPassword()">
                    <i class="fa-solid fa-key me-2"></i>Change Password
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
<script>
// Profile page functionality
document.addEventListener('DOMContentLoaded', function() {
    if (!Auth.requireAuth()) return;
    loadProfileData();
    loadUserStats();
    loadRecentWorkouts();
});

async function loadProfileData() {
    try {
        const user = await Auth.getCurrentUser();
        if (!user) return;
        
        const profileHtml = `
            <div class="text-center mb-4">
                <div class="stat-card-icon mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h5 class="mb-1">${user.full_name || user.username}</h5>
                <p class="text-muted mb-0">@${user.username}</p>
            </div>
            
            ${user.age || user.height || user.weight ? `
            <div class="row text-center mb-3 g-2">
                ${user.age ? `<div class="col-4"><small class="text-muted d-block">Age</small><strong>${user.age}</strong></div>` : ''}
                ${user.height ? `<div class="col-4"><small class="text-muted d-block">Height</small><strong>${user.height} cm</strong></div>` : ''}
                ${user.weight ? `<div class="col-4"><small class="text-muted d-block">Weight</small><strong>${user.weight} kg</strong></div>` : ''}
            </div>
            ` : ''}
            
            <div class="mb-3">
                <small class="text-muted d-block mb-2">Fitness Level</small>
                <span class="badge badge-primary text-capitalize">${user.fitness_level}</span>
            </div>
            
            ${user.goals && user.goals.length > 0 ? `
            <div class="mb-3">
                <small class="text-muted d-block mb-2">Goals</small>
                <div class="d-flex flex-wrap gap-1">
                    ${user.goals.map(goal => `<span class="badge bg-secondary">${goal.replace('_', ' ')}</span>`).join('')}
                </div>
            </div>
            ` : ''}
            
            <div class="text-center mt-3">
                <small class="text-muted">
                    <i class="fa-solid fa-calendar me-1"></i>
                    Member since ${new Date(user.created_at).toLocaleDateString()}
                </small>
            </div>
        `;
        
        document.getElementById('profile-info').innerHTML = profileHtml;
        populateEditForm(user);
        
    } catch (error) {
        document.getElementById('profile-info').innerHTML = `
            <div class="text-center text-danger py-4">
                <i class="fa-solid fa-triangle-exclamation fa-2x mb-2"></i>
                <p>Failed to load profile</p>
            </div>
        `;
    }
}

async function loadUserStats() {
    try {
        const response = await Auth.ApiClient.get('/profile/api/stats');
        
        document.getElementById('stat-workouts').textContent = response.total_workouts || 0;
        document.getElementById('stat-reps').textContent = response.total_reps || 0;
        document.getElementById('stat-calories').textContent = response.total_calories || 0;
        document.getElementById('stat-accuracy').textContent = 
            response.average_accuracy ? `${Math.round(response.average_accuracy)}%` : '0%';
        
    } catch (error) {
        console.error('Failed to load stats:', error);
    }
}

async function loadRecentWorkouts() {
    try {
        const response = await Auth.ApiClient.get('/profile/api/recent-workouts?limit=5');
        const container = document.getElementById('recent-workouts');
        
        if (response.workouts.length === 0) {
            container.innerHTML = `
                <div class="text-center py-4">
                    <i class="fa-solid fa-dumbbell fa-3x text-muted mb-3"></i>
                    <p class="text-muted">No workouts yet</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="/live" class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-video me-1"></i>Live Analysis
                        </a>
                        <a href="/recording" class="btn btn-success btn-sm">
                            <i class="fa-solid fa-upload me-1"></i>Upload Video
                        </a>
                    </div>
                </div>
            `;
            return;
        }
        
        const workoutsHtml = response.workouts.map(workout => `
            <div class="border rounded p-3 mb-2 hover-lift">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="mb-1 text-capitalize">
                            <i class="fa-solid fa-dumbbell me-2 text-primary"></i>
                            ${workout.exercise_name.replace('_', ' ')}
                        </h6>
                        <small class="text-muted">
                            <i class="fa-solid fa-calendar me-1"></i>
                            ${new Date(workout.created_at).toLocaleDateString()}
                        </small>
                    </div>
                    <span class="badge ${workout.session_type === 'live' ? 'badge-primary' : 'bg-success'}">
                        ${workout.session_type}
                    </span>
                </div>
                
                <div class="row mt-2 text-center g-2">
                    <div class="col-4">
                        <small class="text-muted d-block">Reps</small>
                        <strong>${workout.total_reps || 0}</strong>
                    </div>
                    <div class="col-4">
                        <small class="text-muted d-block">Accuracy</small>
                        <strong>${((workout.accuracy_score || 0) * 100).toFixed(1)}%</strong>
                    </div>
                    <div class="col-4">
                        <small class="text-muted d-block">Calories</small>
                        <strong>${(workout.calories_burned || 0).toFixed(1)}</strong>
                    </div>
                </div>
            </div>
        `).join('');
        
        container.innerHTML = workoutsHtml;
        
    } catch (error) {
        document.getElementById('recent-workouts').innerHTML = `
            <div class="alert alert-warning">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                Failed to load workouts
            </div>
        `;
    }
}

function populateEditForm(user) {
    document.getElementById('edit-full-name').value = user.full_name || '';
    document.getElementById('edit-age').value = user.age || '';
    document.getElementById('edit-height').value = user.height || '';
    document.getElementById('edit-weight').value = user.weight || '';
    document.getElementById('edit-fitness-level').value = user.fitness_level || 'beginner';
    
    const goals = user.goals || [];
    document.querySelectorAll('#editProfileModal input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = goals.includes(checkbox.value);
    });
}

async function saveProfile() {
    try {
        Auth.setLoading('save-profile-btn', true);
        
        const formData = {
            full_name: document.getElementById('edit-full-name').value,
            age: parseInt(document.getElementById('edit-age').value) || null,
            height: parseFloat(document.getElementById('edit-height').value) || null,
            weight: parseFloat(document.getElementById('edit-weight').value) || null,
            fitness_level: document.getElementById('edit-fitness-level').value,
            goals: Array.from(document.querySelectorAll('#editProfileModal input[type="checkbox"]:checked')).map(cb => cb.value)
        };
        
        await Auth.updateProfile(formData);
        
        bootstrap.Modal.getInstance(document.getElementById('editProfileModal')).hide();
        loadProfileData();
        
    } catch (error) {
        Auth.showAlert(error.message || 'Failed to update profile', 'danger', 'edit-alert-container');
    } finally {
        Auth.setLoading('save-profile-btn', false);
    }
}

async function changeUserPassword() {
    try {
        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-new-password').value;
        
        if (!currentPassword || !newPassword || !confirmPassword) {
            Auth.showAlert('Please fill in all fields', 'warning', 'password-alert-container');
            return;
        }
        
        if (newPassword !== confirmPassword) {
            Auth.showAlert('New passwords do not match', 'danger', 'password-alert-container');
            return;
        }
        
        if (newPassword.length < 8) {
            Auth.showAlert('New password must be at least 8 characters', 'danger', 'password-alert-container');
            return;
        }
        
        Auth.setLoading('change-password-btn', true);
        
        await Auth.changePassword(currentPassword, newPassword);
        
        bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
        document.getElementById('change-password-form').reset();
        
    } catch (error) {
        Auth.showAlert(error.message || 'Failed to change password', 'danger', 'password-alert-container');
    } finally {
        Auth.setLoading('change-password-btn', false);
    }
}
</script>
{% endblock %}
